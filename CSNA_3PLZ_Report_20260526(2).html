      "<input class=\"sb\" id=\"vg-sb\" placeholder=\"Search partner, site, status\u2026\" oninput=\"filterTable('vg-sb','vg-tb')\"><span id=\"vg-sb_c\" style=\"font-family:monospace;font-size:10px;color:var(--dim);margin-left:8px\"></span>"+
      "<div class=\"tw\"><table id=\"vg-t\"><thead><tr>"+
      "<th onclick=\"sortTable('vg-t',0)\">Partner</th><th onclick=\"sortTable('vg-t',1)\">Status</th>"+
      "<th onclick=\"sortTable('vg-t',2)\">Sites</th><th onclick=\"sortTable('vg-t',3)\">Peers</th>"+
      "<th onclick=\"sortTable('vg-t',4)\">Local</th><th onclick=\"sortTable('vg-t',5)\">Remote</th>"+
      "<th onclick=\"sortTable('vg-t',6)\">IKEv1</th><th onclick=\"sortTable('vg-t',7)\">Weak PFS</th>"+
      "</tr></thead><tbody id=\"vg-tb\">";
    gs.forEach(function(g){
      var st=g.status==="ACTIVE"?"<span class=\"ba\">ACTIVE</span>":g.status==="CONFIGURED"?"<span class=\"bc\">CONFIGURED</span>":"<span class=\"bi\">INACTIVE</span>";
      var sites=(g.siteArr||[]).map(sbadge).join(" ");
      h+="<tr><td style=\"color:var(--bright);font-weight:600\">"+esc(g.name)+"</td><td>"+st+"</td><td>"+sites+"</td>"+
        "<td style=\"color:var(--dim)\">"+g.peerCount+"</td><td style=\"color:var(--accent)\">"+g.localNets+"</td>"+
        "<td style=\"color:var(--dim)\">"+g.remoteNets+"</td>"+
        "<td>"+(g.ike1Count>0?"<span class=\"b1\">"+g.ike1Count+"</span>":"<span style=\"color:var(--dim)\">0</span>")+"</td>"+
        "<td>"+(g.weakCount>0?"<span class=\"bw\">"+g.weakCount+"</span>":"<span style=\"color:var(--dim)\">0</span>")+"</td></tr>";
    });
    h+="</tbody></table></div>";
    document.getElementById(id).innerHTML=h;
  }
  if(id==="pane-i"){
    var pp=D.vpnPeers;
    var h="<div class=\"st\">ISAKMP Peer Registry &mdash; "+pp.length+" peers</div>"+
      "<input class=\"sb\" id=\"ip-sb\" placeholder=\"Search partner, IP, gateway, transform set\u2026\" oninput=\"filterTable('ip-sb','ip-tb')\"><span id=\"ip-sb_c\" style=\"font-family:monospace;font-size:10px;color:var(--dim);margin-left:8px\"></span>"+
      "<div class=\"tw\"><table id=\"ip-t\"><thead><tr>"+
      "<th onclick=\"sortTable('ip-t',0)\">Partner</th><th onclick=\"sortTable('ip-t',1)\">Site</th>"+
      "<th onclick=\"sortTable('ip-t',2)\">Local GW</th><th onclick=\"sortTable('ip-t',3)\">Peer IP</th>"+
      "<th onclick=\"sortTable('ip-t',4)\">IKE</th><th onclick=\"sortTable('ip-t',5)\">PFS</th>"+
      "<th onclick=\"sortTable('ip-t',6)\">Transform Set</th>"+
      "<th onclick=\"sortTable('ip-t',7)\">Local</th><th onclick=\"sortTable('ip-t',8)\">Remote</th>"+
      "</tr></thead><tbody id=\"ip-tb\">";
    pp.forEach(function(p){
      var site=(p.gateway_site||"").toUpperCase();
      var sc={SHEA:"#60a5fa",WOONSOCKET:"#a78bfa",WDC:"#fb923c",MDC:"#4ade80"}[site]||"#5a6a7a";
      var ike1=p.ike_version==="1";
      var weak=["group1","group2","group5"].includes((p.pfs_group||"").toLowerCase());
      h+="<tr><td style=\"color:var(--bright);font-weight:600\">"+esc(p.partner_name||p.peer_ip)+"</td>"+
        "<td><span style=\"display:inline-block;padding:1px 6px;border-radius:1px;font-size:9px;font-weight:700;background:"+sc+"22;color:"+sc+"\">"+esc(site)+"</span></td>"+
        "<td style=\"color:var(--dim)\">"+esc(p.local_gateway)+"</td>"+
        "<td style=\"color:var(--accent)\">"+esc(p.peer_ip)+"</td>"+
        "<td>"+(ike1?"<span class=\"b1\">IKEv1</span>":"<span class=\"b2\">IKEv2</span>")+"</td>"+
        "<td>"+(weak?"<span class=\"bw\">"+esc(p.pfs_group)+"</span>":esc(p.pfs_group)||"<span style=\"color:var(--dim)\">\u2014</span>")+"</td>"+
        "<td style=\"color:var(--dim);font-size:10px\">"+esc(p.transform_set)+"</td>"+
        "<td style=\"text-align:center\">"+esc(p.local_subnet_count||0)+"</td>"+
        "<td style=\"text-align:center;color:var(--dim)\">"+esc(p.remote_subnet_count||0)+"</td></tr>";
    });
    h+="</tbody></table></div>";
    document.getElementById(id).innerHTML=h;
  }
}
buildPane("pane-s");</script></body></html>
